include ':app'
def getFinalPluginDir() {
  try {
    def p = ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()
    if (p && new File(p).exists()) return new File(p).getParentFile()
  } catch (Exception ignored) {}
  return new File(rootDir, "../node_modules/@react-native/gradle-plugin")
}
includeBuild(getFinalPluginDir())
