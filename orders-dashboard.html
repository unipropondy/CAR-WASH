<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders Dashboard – Car Wash POS</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            navy: '#0F172A',
            pageBg: '#F1F4F9',
            borderCol: '#E2E8F0',
            mutedText: '#475569',
            brandGreen: '#047857',
            brandBlue: '#1D4ED8',
            brandAmber: '#92400E',
            brandRed: '#B91C1C',
          },
          boxShadow: {
            soft: '0 4px 20px -2px rgba(15, 23, 42, 0.04), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
            card: '0 10px 30px -5px rgba(15, 23, 42, 0.05), 0 4px 10px -2px rgba(15, 23, 42, 0.02)',
          }
        }
      }
    }
  </script>

  <!-- React 18 and Babel Standalone for clean component architecture -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F1F4F9;
      color: #0F172A;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbar for table container */
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F1F5F9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94A3B8;
    }
  </style>
</head>
<body class="bg-[#F1F4F9] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Sample dataset exactly matching the user request & screenshot
    const INITIAL_ORDERS = [
      {
        id: '#RB20261102-0005',
        customer: { name: 'Loki', phone: '99761811', avatarBg: '#4F46E5', initials: 'LO' },
        vehicle: { plate: 'TN22DU1324', type: 'Sedan' },
        package: { name: 'Deluxe Wash & Vacuum', tier: 'deluxe', category: 'CAR WASH' },
        amount: 22.00,
        payMode: 'CASH',
        paymentStatus: 'Paid',
        bay: 'Bay 5',
        waitMinutes: 10,
        waitText: '10 min',
        status: 'In Service', // Active in service
        history: [
          { time: '09:30 AM', event: 'Order created via Kiosk', user: 'Customer' },
          { time: '09:32 AM', event: 'Cash payment confirmed ($ 22.00)', user: 'Cashier (CS)' },
          { time: '09:35 AM', event: 'Assigned to Washing Bay 5', user: 'Cashier (CS)' },
          { time: '09:40 AM', event: 'Service commenced in Bay 5', user: 'Operator' }
        ]
      },
      {
        id: '#RB20261102-0004',
        customer: { name: 'LOKI', phone: '76391272', avatarBg: '#4F46E5', initials: 'LO' },
        vehicle: { plate: 'LOKI', type: 'Sedan' },
        package: { name: 'Premium Hydrophobic Coat', tier: 'premium', category: 'CAR WASH' },
        amount: 30.00,
        payMode: 'CASH',
        paymentStatus: 'Paid',
        bay: 'Bay 2',
        waitMinutes: 18,
        waitText: '18 min',
        status: 'Closed',
        history: [
          { time: '08:50 AM', event: 'Order created via Kiosk', user: 'Customer' },
          { time: '08:52 AM', event: 'Paid $ 30.00 cash', user: 'Cashier (CS)' },
          { time: '08:55 AM', event: 'Assigned to Bay 2', user: 'Operator' },
          { time: '09:10 AM', event: 'Service Completed', user: 'Operator' },
          { time: '09:12 AM', event: 'Handover & Closed', user: 'Cashier (CS)' }
        ]
      },
      {
        id: '#RB20261102-0003',
        customer: { name: 'Rachel Tan', phone: '91234567', avatarBg: '#0D9488', initials: 'RT' },
        vehicle: { plate: 'SMG 8899 D', type: 'Sedan' },
        package: { name: 'Express Foam Wash', tier: 'express', category: 'CAR WASH' },
        amount: 15.00,
        payMode: 'CASH',
        paymentStatus: 'Paid',
        bay: 'Bay 1',
        waitMinutes: 25,
        waitText: '25 min',
        status: 'Closed',
        history: [
          { time: '08:15 AM', event: 'Order created via Kiosk', user: 'Customer' },
          { time: '08:16 AM', event: 'Paid $ 15.00 cash', user: 'Cashier (CS)' },
          { time: '08:20 AM', event: 'Assigned to Bay 1', user: 'Operator' },
          { time: '08:35 AM', event: 'Service Completed', user: 'Operator' },
          { time: '08:40 AM', event: 'Vehicle Handover & Closed', user: 'Cashier (CS)' }
        ]
      },
      {
        id: '#RB20261102-0002',
        customer: { name: 'Bryan Lim (Live)', phone: '88776655', avatarBg: '#EA580C', initials: 'BL' },
        vehicle: { plate: 'SLK 9988 X', type: 'Sedan' },
        package: { name: 'Deluxe Wash & Vacuum', tier: 'deluxe', category: 'CAR WASH' },
        amount: 22.00,
        payMode: 'CASH',
        paymentStatus: 'Paid',
        bay: 'Bay 1',
        waitMinutes: 45,
        waitText: '45 min',
        status: 'Closed',
        history: [
          { time: '07:30 AM', event: 'Order created via Kiosk', user: 'Customer' },
          { time: '07:32 AM', event: 'Paid $ 22.00 cash', user: 'Cashier (CS)' },
          { time: '07:35 AM', event: 'Assigned to Bay 1', user: 'Operator' },
          { time: '08:10 AM', event: 'Completed wash', user: 'Operator' },
          { time: '08:15 AM', event: 'Closed', user: 'Cashier (CS)' }
        ]
      },
      {
        id: '#RB20261102-0001',
        customer: { name: 'Marcus Tan', phone: '91234567', avatarBg: '#059669', initials: 'MT' },
        vehicle: { plate: 'SJA 8899 M', type: 'Sedan' },
        package: { name: 'Express Foam Wash', tier: 'express', category: 'CAR WASH' },
        amount: 15.00,
        payMode: 'CASH',
        paymentStatus: 'Paid',
        bay: 'Bay 2',
        waitMinutes: 98,
        waitText: '1h 38m',
        status: 'Closed',
        history: [
          { time: '06:45 AM', event: 'Order created via Kiosk', user: 'Customer' },
          { time: '06:48 AM', event: 'Paid $ 15.00 cash', user: 'Cashier (CS)' },
          { time: '07:00 AM', event: 'Assigned to Bay 2', user: 'Operator' },
          { time: '07:20 AM', event: 'Completed', user: 'Operator' },
          { time: '08:23 AM', event: 'Order Closed', user: 'Cashier (CS)' }
        ]
      }
    ];

    const FILTER_OPTIONS = [
      { id: 'ALL', label: 'All Orders' },
      { id: 'PENDING_PAYMENT', label: 'Pending Payment' },
      { id: 'PAID_WAITING', label: 'Paid / Waiting' },
      { id: 'IN_SERVICE', label: 'In Service' },
      { id: 'COMPLETED', label: 'Completed' },
      { id: 'CLOSED', label: 'Closed' },
      { id: 'CANCELLED', label: 'Cancelled' },
    ];

    // ================== SVG ICONS ==================
    const CarIcon = () => (
      <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0" />
      </svg>
    );

    const WaterDropIcon = () => (
      <svg className="w-3.5 h-3.5 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
      </svg>
    );

    const CheckIcon = () => (
      <svg className="w-3.5 h-3.5 text-emerald-600 stroke-current" fill="none" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" />
      </svg>
    );

    const ClockIcon = () => (
      <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" strokeWidth="2" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 7v5l3 3" />
      </svg>
    );

    const SearchIcon = () => (
      <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    );

    // ================== COMPONENT: TOP BAR ==================
    const TopBar = ({ searchQuery, setSearchQuery }) => {
      return (
        <header className="bg-white border-b border-[#E2E8F0] px-6 py-3.5 sticky top-0 z-30 shadow-xs">
          <div className="max-w-[1400px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            {/* Left: Logo, Title & Search */}
            <div className="flex items-center gap-4 w-full sm:w-auto">
              {/* Black rounded square Menu Icon button */}
              <button
                onClick={() => alert('Side Menu')}
                aria-label="Toggle side menu"
                className="w-9 h-9 bg-[#0F172A] hover:bg-slate-800 text-white rounded-lg flex items-center justify-center shadow-sm shrink-0 transition cursor-pointer"
              >
                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.4" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
              
              <h2 className="text-xl font-extrabold text-[#0F172A] tracking-tight">
                Orders
              </h2>

              {/* Search Bar */}
              <div className="relative flex-1 sm:w-80 ml-2">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                  <SearchIcon />
                </div>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search order, customer or plate"
                  className="w-full pl-10 pr-4 py-2 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm font-medium text-[#0F172A] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-navy focus:border-transparent transition"
                  aria-label="Search orders"
                />
              </div>
            </div>

            {/* Right: Cashier User Avatar */}
            <div className="flex items-center gap-3 shrink-0 self-end sm:self-auto">
              <div className="w-9 h-9 rounded-full bg-black text-white font-bold text-xs flex items-center justify-center shadow-xs">
                CS
              </div>
              <span className="text-sm font-semibold text-[#0F172A]">
                Cashier
              </span>
            </div>
          </div>
        </header>
      );
    };

    // ================== COMPONENT: SUMMARY CARD ==================
    const SummaryCard = ({ label, value }) => (
      <div className="bg-white rounded-2xl border border-[#E2E8F0] p-5 shadow-soft hover:shadow-card transition duration-200">
        <p className="text-[11px] font-extrabold uppercase tracking-wider text-slate-500 mb-2">
          {label}
        </p>
        <p className="text-3xl font-extrabold text-[#0F172A] tracking-tight">
          {value}
        </p>
      </div>
    );

    // ================== COMPONENT: PACKAGE PILL ==================
    const PackageBadge = ({ pkg }) => {
      let bgStyle = 'bg-[#FEF3C7] text-[#92400E] border-[#FDE68A]'; // deluxe amber default
      if (pkg.tier === 'premium') {
        bgStyle = 'bg-[#FEE2E2] text-[#B91C1C] border-[#FECACA]'; // premium red
      } else if (pkg.tier === 'express') {
        bgStyle = 'bg-[#E0F2FE] text-[#1D4ED8] border-[#BAE6FD]'; // express blue
      }

      return (
        <div>
          <span className={`inline-block px-3 py-1 rounded-full text-xs font-bold border ${bgStyle} tracking-tight`}>
            {pkg.name}
          </span>
          <p className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mt-1">
            {pkg.category}
          </p>
        </div>
      );
    };

    // ================== COMPONENT: WAIT TIME DISPLAY ==================
    const WaitBadge = ({ minutes, text }) => {
      let colorClass = 'text-slate-600 font-semibold';
      if (minutes >= 40) {
        colorClass = 'text-[#B91C1C] font-extrabold'; // Over 40m red
      } else if (minutes >= 20) {
        colorClass = 'text-amber-700 font-bold'; // 20-40m amber
      }

      return (
        <span className={`text-sm ${colorClass}`}>
          {text}
        </span>
      );
    };

    // ================== MAIN APP COMPONENT ==================
    const App = () => {
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [activeFilter, setActiveFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedOrderForView, setSelectedOrderForView] = useState(null);
      const [selectedOrderForHistory, setSelectedOrderForHistory] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      // Trigger a temporary notification
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Handle Marking an order as Done (Completed)
      const handleMarkDone = (orderId) => {
        setOrders((prev) =>
          prev.map((o) => {
            if (o.id === orderId) {
              const updated = {
                ...o,
                status: 'Completed',
                history: [
                  ...o.history,
                  {
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    event: 'Service marked Completed via POS Action',
                    user: 'Cashier (CS)',
                  },
                ],
              };
              return updated;
            }
            return o;
          })
        );
        showToast(`Order ${orderId} marked as COMPLETED!`);
      };

      // Compute Counts dynamically
      const counts = useMemo(() => {
        return {
          ALL: orders.length,
          PENDING_PAYMENT: orders.filter((o) => o.status === 'Pending Payment').length,
          PAID_WAITING: orders.filter((o) => o.status === 'Paid / Waiting').length,
          IN_SERVICE: orders.filter((o) => o.status === 'In Service').length,
          COMPLETED: orders.filter((o) => o.status === 'Completed').length,
          CLOSED: orders.filter((o) => o.status === 'Closed').length,
          CANCELLED: orders.filter((o) => o.status === 'Cancelled').length,
        };
      }, [orders]);

      // Summary Card Stats
      const totalRevenue = useMemo(() => {
        return orders.reduce((sum, o) => sum + o.amount, 0).toFixed(2);
      }, [orders]);

      // Filtered Orders List
      const filteredOrders = useMemo(() => {
        return orders.filter((order) => {
          // Status filter
          let matchesFilter = true;
          if (activeFilter === 'PENDING_PAYMENT') matchesFilter = order.status === 'Pending Payment';
          else if (activeFilter === 'PAID_WAITING') matchesFilter = order.status === 'Paid / Waiting';
          else if (activeFilter === 'IN_SERVICE') matchesFilter = order.status === 'In Service';
          else if (activeFilter === 'COMPLETED') matchesFilter = order.status === 'Completed';
          else if (activeFilter === 'CLOSED') matchesFilter = order.status === 'Closed';
          else if (activeFilter === 'CANCELLED') matchesFilter = order.status === 'Cancelled';

          if (!matchesFilter) return false;

          // Search query filter (Order ID, Customer Name, License Plate)
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const idMatch = order.id.toLowerCase().includes(q);
            const nameMatch = order.customer.name.toLowerCase().includes(q);
            const plateMatch = order.vehicle.plate.toLowerCase().includes(q);
            const phoneMatch = order.customer.phone.includes(q);
            return idMatch || nameMatch || plateMatch || phoneMatch;
          }

          return true;
        });
      }, [orders, activeFilter, searchQuery]);

      return (
        <div className="min-h-screen flex flex-col bg-[#F1F4F9]">
          {/* 1. TOP BAR */}
          <TopBar searchQuery={searchQuery} setSearchQuery={setSearchQuery} />

          {/* Toast Alert */}
          {toastMessage && (
            <div className="fixed top-20 right-6 z-50 bg-[#0F172A] text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 border border-slate-700 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              <p className="text-sm font-bold">{toastMessage}</p>
            </div>
          )}

          {/* MAIN PAGE CONTAINER */}
          <main className="max-w-[1400px] w-full mx-auto px-4 sm:px-6 py-8 flex-1 flex flex-col gap-6">
            
            {/* 2. PAGE HEADER */}
            <div>
              <h1 className="text-3xl font-extrabold text-[#0F172A] tracking-tight">
                Today’s orders
              </h1>
              <p className="text-sm font-medium text-slate-500 mt-1">
                Monday, 2 November 2026
              </p>
            </div>

            {/* 3. FOUR SUMMARY CARDS */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
              <SummaryCard label="TOTAL ORDERS" value={counts.ALL} />
              <SummaryCard label="IN SERVICE" value={counts.IN_SERVICE} />
              <SummaryCard label="CLOSED" value={counts.CLOSED} />
              <SummaryCard label="REVENUE" value={`$${totalRevenue}`} />
            </div>

            {/* 4. LARGE WHITE ROUNDED CARD (20px radius, soft shadow) */}
            <div className="bg-white rounded-[20px] border border-[#E2E8F0] p-6 shadow-soft flex flex-col">
              
              {/* 4.a Filter pills with count badges */}
              <div className="flex items-center gap-2.5 overflow-x-auto pb-4 custom-scrollbar mb-4 border-b border-[#F1F5F9]">
                {FILTER_OPTIONS.map((f) => {
                  const isActive = activeFilter === f.id;
                  const count = counts[f.id] || 0;

                  return (
                    <button
                      key={f.id}
                      onClick={() => setActiveFilter(f.id)}
                      className={`min-h-[44px] px-4 py-2 rounded-full text-xs font-extrabold flex items-center gap-2 transition shrink-0 cursor-pointer border ${
                        isActive
                          ? 'bg-[#0F172A] text-white border-[#0F172A] shadow-xs'
                          : 'bg-[#F8FAFC] text-slate-600 border-[#E2E8F0] hover:bg-slate-100 hover:text-slate-900'
                      }`}
                      aria-label={`Filter by ${f.label} (${count})`}
                    >
                      <span>{f.label}</span>
                      <span
                        className={`text-[10px] font-extrabold px-2 py-0.5 rounded-full ${
                          isActive
                            ? 'bg-slate-700 text-white'
                            : 'bg-[#E2E8F0] text-slate-700'
                        }`}
                      >
                        {count}
                      </span>
                    </button>
                  );
                })}
              </div>

              {/* 4.b DATA TABLE - Desktop View (Horizontal scroll only below 1180px) */}
              <div className="hidden md:block overflow-x-auto custom-scrollbar">
                <table className="w-full border-collapse text-left min-w-[1050px]">
                  <thead>
                    <tr className="border-b border-[#F1F5F9] text-[11px] font-extrabold uppercase tracking-wider text-slate-400">
                      <th className="py-3 px-3 w-[15%]">ORDER</th>
                      <th className="py-3 px-3 w-[17%]">CUSTOMER</th>
                      <th className="py-3 px-3 w-[14%]">VEHICLE</th>
                      <th className="py-3 px-3 w-[18%]">PACKAGE</th>
                      <th className="py-3 px-3 w-[10%]">AMOUNT</th>
                      <th className="py-3 px-3 w-[9%]">PAYMENT</th>
                      <th className="py-3 px-3 w-[8%]">BAY</th>
                      <th className="py-3 px-3 w-[7%]">WAIT</th>
                      <th className="py-3 px-3 w-[12%] text-right">ACTION</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#F1F5F9]">
                    {filteredOrders.length === 0 ? (
                      <tr>
                        <td colSpan="9" className="text-center py-12 text-slate-400 font-semibold text-sm">
                          No matching orders found under this view.
                        </td>
                      </tr>
                    ) : (
                      filteredOrders.map((order) => {
                        const isOver40 = order.waitMinutes >= 40;
                        const isInService = order.status === 'In Service';

                        return (
                          <tr
                            key={order.id}
                            className={`transition group ${
                              isOver40
                                ? 'bg-[#FEF2F2] border-l-4 border-l-[#B91C1C]'
                                : 'hover:bg-[#F8FAFC]'
                            }`}
                          >
                            {/* ORDER */}
                            <td className="py-4 px-3 align-middle">
                              <span className="inline-block bg-[#F1F5F9] text-slate-800 text-xs font-bold font-mono-code px-2.5 py-1 rounded-md border border-[#E2E8F0]">
                                {order.id}
                              </span>
                            </td>

                            {/* CUSTOMER */}
                            <td className="py-4 px-3 align-middle">
                              <div className="flex items-center gap-3">
                                <div
                                  className="w-8 h-8 rounded-full text-white font-extrabold text-xs flex items-center justify-center shrink-0 shadow-xs"
                                  style={{ backgroundColor: order.customer.avatarBg }}
                                >
                                  {order.customer.initials}
                                </div>
                                <div className="min-w-0">
                                  <p className="text-sm font-bold text-[#0F172A] truncate">
                                    {order.customer.name}
                                  </p>
                                  <p className="text-xs text-slate-400 font-medium font-mono-code">
                                    {order.customer.phone}
                                  </p>
                                </div>
                              </div>
                            </td>

                            {/* VEHICLE */}
                            <td className="py-4 px-3 align-middle">
                              <div>
                                <span className="inline-flex items-center gap-1.5 bg-[#1E293B] text-white font-mono-code text-xs font-bold px-2.5 py-1 rounded-md shadow-xs">
                                  <CarIcon />
                                  <span>{order.vehicle.plate}</span>
                                </span>
                                <p className="text-xs text-slate-400 font-medium mt-1">
                                  {order.vehicle.type}
                                </p>
                              </div>
